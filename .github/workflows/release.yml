name: Release Build

on:
  push:
    tags:
      - 'v*' # Trigger when pushing tags that start with "v" (e.g., v1.0.0)

jobs:
  build:
    name: Build for ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_suffix: windows-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive_suffix: linux-x64.tar.gz
          - os: macos-latest
            rid: osx-x64
            archive_suffix: macos-x64.zip
          - os: macos-latest
            rid: osx-arm64
            archive_suffix: macos-arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish App
        # Building as self-contained so users don't need to install the .NET runtime
        run: dotnet publish src/Desktop/Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      - name: Publish Server App
        run: dotnet publish src/Server/Server.csproj -c Release -r ${{ matrix.rid }} -p:PublishSingleFile=true --self-contained true -o publish-server

      - name: Archive Build (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path publish\* -DestinationPath Synq-${{ github.ref_name }}-${{ matrix.archive_suffix }}
          Compress-Archive -Path publish-server\* -DestinationPath Synq-Server-${{ github.ref_name }}-${{ matrix.archive_suffix }}

      - name: Archive Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd publish
          zip -r ../Synq-${{ github.ref_name }}-${{ matrix.archive_suffix }} ./*
          cd ../publish-server
          zip -r ../Synq-Server-${{ github.ref_name }}-${{ matrix.archive_suffix }} ./*

      - name: Archive Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish
          tar -czvf ../Synq-${{ github.ref_name }}-${{ matrix.archive_suffix }} ./*
          cd ../publish-server
          tar -czvf ../Synq-Server-${{ github.ref_name }}-${{ matrix.archive_suffix }} ./*

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synq-${{ github.ref_name }}-${{ matrix.archive_suffix }}
          path: Synq-${{ github.ref_name }}-${{ matrix.archive_suffix }}

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synq-Server-${{ github.ref_name }}-${{ matrix.archive_suffix }}
          path: Synq-Server-${{ github.ref_name }}-${{ matrix.archive_suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true

  docker:
    name: Publish Docker Image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

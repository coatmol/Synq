name: Release Build

on:
  push:
    tags:
      - 'v*' # Trigger when pushing tags that start with "v" (e.g., v1.0.0)

jobs:
  build:
    name: Build for ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_name: Synq-windows-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive_name: Synq-linux-x64.tar.gz
          - os: macos-latest
            rid: osx-x64
            archive_name: Synq-macos-x64.zip
          - os: macos-latest
            rid: osx-arm64
            archive_name: Synq-macos-arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish App
        # Building as self-contained so users don't need to install the .NET runtime
        run: dotnet publish src/Desktop/Desktop.csproj -c Release -r ${{ matrix.rid }} --self-contained true -o publish

      - name: Archive Build (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish\* -DestinationPath ${{ matrix.archive_name }}

      - name: Archive Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cd publish
          zip -r ../${{ matrix.archive_name }} ./*

      - name: Archive Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cd publish
          tar -czvf ../${{ matrix.archive_name }} ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

      - name: Release to GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
